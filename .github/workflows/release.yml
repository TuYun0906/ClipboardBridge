name: Build and publish
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  release:
    runs-on: windows-2022
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build and verify both apps
        shell: pwsh
        env:
          CLIPBOARD_APK_KEY: ${{ secrets.ANDROID_SIGNING_KEY }}
          CLIPBOARD_APK_PASSWORD: ${{ secrets.ANDROID_SIGNING_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'
          $version = $env:GITHUB_REF_NAME
          if ($env:GITHUB_REF_TYPE -ne 'tag') { $version = 'v0.3.0' }
          if ($version -notmatch '^v(\d{1,3})\.(\d{1,3})\.(\d{1,3})$') { throw 'Use vMAJOR.MINOR.PATCH' }
          $code = [int]$Matches[1] * 1000000 + [int]$Matches[2] * 1000 + [int]$Matches[3]
          $sdk = $env:ANDROID_HOME
          $sdkmanager = Join-Path $sdk 'cmdline-tools/latest/bin/sdkmanager.bat'
          & $sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
          if ($LASTEXITCODE) { throw 'Android SDK installation failed' }
          ./android/fetch-deps.ps1
          ./tests/check-wire.ps1
          if ($LASTEXITCODE) { throw 'Wire test failed' }
          ./tests/check-tls.ps1
          if ($LASTEXITCODE) { throw 'TLS test failed' }
          ./windows/build.ps1
          if ($LASTEXITCODE) { throw 'Windows build failed' }
          if (!$env:CLIPBOARD_APK_KEY -or !$env:CLIPBOARD_APK_PASSWORD) { throw 'Android signing secrets are missing' }
          $key = Join-Path $env:RUNNER_TEMP 'clipboard-signing.p12'
          try {
            [IO.File]::WriteAllBytes($key, [Convert]::FromBase64String($env:CLIPBOARD_APK_KEY))
            Remove-Item Env:CLIPBOARD_APK_KEY
            ./android/build.ps1 -AndroidJar (Join-Path $sdk 'platforms/android-35/android.jar') -BuildTools (Join-Path $sdk 'build-tools/35.0.0') -Jdk $env:JAVA_HOME -VersionCode $code -VersionName $version.Substring(1) -SigningKey $key
            if ($LASTEXITCODE) { throw 'Android build failed' }
          } finally {
            Remove-Item -LiteralPath $key -ErrorAction SilentlyContinue
          }
      - name: Publish tagged version
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create $env:GITHUB_REF_NAME ./windows/build/Clipboard-Windows.exe ./android/build/Clipboard-Android.apk --verify-tag --generate-notes
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

